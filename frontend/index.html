<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>

    <!-- ВРЕМЕННАЯ ДИАГНОСТИКА diag-2: удалить после нахождения причины -->
    <script>
      (function () {
        var BUILD = "diag-2";
        var t0 = Date.now();
        var errors = [];
        var xhrLog = {};
        var xhrStarted = {};
        var panel = null;

        function safe(fn) {
          try { return fn(); } catch (e) { return "ERR: " + e; }
        }
        function ts() {
          return ((Date.now() - t0) / 1000).toFixed(1) + "s";
        }

        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t !== window && (t.src || t.href)) {
              errors.push("[" + ts() + "] RESOURCE FAILED: " + (t.src || t.href));
            } else {
              errors.push(
                "[" + ts() + "] JS ERROR: " + e.message + " @ " +
                  e.filename + ":" + e.lineno + ":" + e.colno
              );
            }
          },
          true
        );
        window.addEventListener("unhandledrejection", function (e) {
          errors.push(
            "[" + ts() + "] PROMISE: " +
              (e.reason && e.reason.message ? e.reason.message : e.reason)
          );
        });

        function probe(src) {
          if (xhrStarted[src]) return;
          xhrStarted[src] = true;
          xhrLog[src] = "pending since " + ts();
          try {
            var x = new XMLHttpRequest();
            x.open("GET", src, true);
            x.onreadystatechange = function () {
              if (x.readyState === 4) {
                var body = x.responseText || "";
                xhrLog[src] =
                  "HTTP " + x.status +
                  " | content-type: " + x.getResponseHeader("content-type") +
                  " | bytes: " + body.length +
                  " | starts: " + body.slice(0, 60).replace(/\s+/g, " ") +
                  " (done at " + ts() + ")";
              }
            };
            x.onerror = function () {
              xhrLog[src] = "XHR NETWORK ERROR at " + ts();
            };
            x.send();
          } catch (e) {
            xhrLog[src] = "XHR EXC: " + e;
          }
        }

        function render() {
          if (!document.body) return;
          if (!panel) {
            panel = document.createElement("pre");
            panel.style.cssText =
              "position:fixed;left:0;right:0;bottom:0;max-height:55%;overflow:auto;" +
              "z-index:2147483647;margin:0;padding:8px;background:rgba(255,255,255,.96);" +
              "color:#000;border-top:2px solid #c00;font:10px/1.35 monospace;" +
              "white-space:pre-wrap;word-break:break-all;";
            document.body.appendChild(panel);
          }

          var root = document.getElementById("root");
          var wa = window.WebApp;
          var L = [];
          var i, k;

          L.push("BUILD " + BUILD + " | t=" + ts());
          L.push("UA: " + navigator.userAgent);
          L.push(
            "WebApp: " + typeof wa + " | initData len: " +
              safe(function () { return wa && wa.initData ? wa.initData.length : 0; })
          );

          L.push("--- #root ---");
          L.push(
            "children: " + (root ? root.children.length : "n/a") +
              " | placeholder still here: " + !!document.getElementById("bc-boot")
          );
          var reactKeys = 0;
          if (root) {
            var ks = Object.keys(root);
            for (i = 0; i < ks.length; i++) {
              if (
                ks[i].indexOf("__reactContainer$") === 0 ||
                ks[i].indexOf("_reactListening") === 0
              ) reactKeys++;
            }
          }
          L.push("React createRoot called: " + (reactKeys ? "YES" : "NO"));

          L.push("--- module scripts in DOM ---");
          var mods = document.querySelectorAll('script[type="module"]');
          if (!mods.length) L.push("NONE");
          for (i = 0; i < mods.length; i++) {
            var src = mods[i].getAttribute("src");
            L.push((src || "(inline)") + " | crossorigin=" + mods[i].getAttribute("crossorigin"));
            if (src) probe(src);
          }

          L.push("--- XHR probe of module file ---");
          var any = false;
          for (k in xhrLog) {
            any = true;
            L.push(k + "\n  -> " + xhrLog[k]);
          }
          if (!any) L.push("(none)");

          L.push("--- resource timing (completed) ---");
          var entries = safe(function () {
            return performance.getEntriesByType("resource");
          });
          if (entries && entries.length) {
            for (i = 0; i < entries.length; i++) {
              var en = entries[i];
              if (
                en.name.indexOf("/assets/") > -1 ||
                en.name.indexOf("max-web-app") > -1 ||
                en.name.indexOf("hud") > -1
              ) {
                L.push(
                  en.name.slice(-48) + " | " + en.initiatorType +
                    " | dur=" + Math.round(en.duration) + "ms" +
                    " | transfer=" + en.transferSize +
                    " | body=" + en.decodedBodySize
                );
              }
            }
          } else {
            L.push("(no entries)");
          }

          L.push("--- errors (" + errors.length + ") ---");
          for (i = 0; i < errors.length; i++) L.push(errors[i]);

          panel.textContent = L.join("\n");
        }

        var timer = setInterval(render, 500);
        setTimeout(function () { clearInterval(timer); render(); }, 60000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="bc-boot" style="padding:16px;font:14px sans-serif;color:#666">
        Загрузка… diag-2
      </div>
    </div>

    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
